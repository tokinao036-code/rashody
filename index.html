<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мои расходы</title>
<meta name="description" content="Простой счётчик расходов">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Расходы">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1F1E1C; --ink-2:#4A4741; --muted:#8C877E;
  --line:#ECE7DD; --soft:#F1EEE7; --bar:#DDD6C9; --danger:#D9433B;
  --r-lg:26px; --r-md:18px; --r-sm:14px;
  --shadow:0 1px 2px rgba(31,30,28,.04),0 10px 30px rgba(31,30,28,.06);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.3,.5,1);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
body,button,a,label,input{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;min-height:100dvh;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,label:focus-within{outline:2.5px solid var(--ink);outline-offset:2px}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
.app{max-width:560px;margin:0 auto;padding:calc(22px + var(--safe-t)) 16px calc(130px + var(--safe-b))}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.date{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.date svg{color:#C9963B}
.greet{font-family:var(--display);font-weight:500;font-size:clamp(30px,8.6vw,38px);line-height:1.08;letter-spacing:-.01em;margin-top:8px}
.greet em{font-style:italic;font-weight:600}
.greet .word,.greet em{display:inline-block;animation:rise .7s var(--ease) both}
.greet em{animation-delay:.08s}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .2s var(--spring)}
.icon-btn:active{transform:scale(.9)}

/* ---------- segmented ---------- */
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{position:relative;z-index:1;height:42px;border-radius:999px;font-size:15px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-selected=true]{color:var(--ink)}
.seg .pill{position:absolute;top:4px;left:0;height:42px;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.06);transition:transform .38s var(--spring),width .38s var(--spring)}

/* ---------- summary ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.summary{padding:14px 14px 18px;margin-bottom:14px;touch-action:pan-y}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pnav .arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,transform .2s var(--spring),opacity .2s}
.pnav .arrow:active{transform:scale(.88);background:var(--soft)}
.pnav .arrow:disabled{opacity:.25;pointer-events:none}
.plabel{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:12px}
.plabel b{font-size:16px;font-weight:700}
.plabel small{font-size:12px;font-weight:700;color:#2E7D55;letter-spacing:.02em;height:15px;opacity:0;transition:opacity .2s}
.plabel.past small{opacity:1}
.total{text-align:center;font-weight:800;font-size:clamp(40px,12vw,52px);letter-spacing:-.03em;line-height:1.05;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.total .cur{font-weight:600;color:var(--muted);margin-left:.18em;font-size:.62em;letter-spacing:0}
.sub{text-align:center;color:var(--muted);font-size:14px;font-weight:500;min-height:20px}

.chart{display:flex;align-items:flex-end;gap:3px;height:112px;margin:18px 4px 0;padding-bottom:20px;position:relative}
.chart:empty{display:none}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;border-radius:6px;min-width:0}
.col .bar{width:100%;max-width:26px;border-radius:6px;background:var(--bar);transform-origin:bottom;transform:scaleY(0);transition:transform .6s var(--spring),background .2s;min-height:3px}
.chart.show .col .bar{transform:scaleY(1)}
.col.zero .bar{background:var(--line)}
.col.now .bar{background:var(--ink)}
.col.future{pointer-events:none}.col.future .bar{background:transparent;border:1.5px dashed var(--line)}
.col:active .bar{background:var(--ink-2)}
.col span{position:absolute;bottom:-20px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.col.now span{color:var(--ink);font-weight:800}

.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft);margin:20px 4px 0;gap:2px}
.stack i{display:block;height:100%;width:0;transition:width .7s var(--ease)}
.stack:empty{display:none}

/* ---------- categories breakdown ---------- */
.section-title{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:24px 6px 10px}
.section-title button{font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--card);padding:6px 12px;border-radius:99px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.cats{padding:6px}
.cat-row{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px;border-radius:var(--r-sm);text-align:left;transition:background .2s,opacity .25s,transform .2s var(--spring)}
.cat-row:active{transform:scale(.98);background:var(--soft)}
.cat-row.dim{opacity:.38}
.cat-row.on{background:var(--soft)}
.cat-row .name{font-weight:700;font-size:16px;display:block}
.cat-row .track{display:block;height:5px;background:var(--soft);border-radius:9px;margin-top:7px;overflow:hidden}
.cat-row .track i{display:block;height:100%;border-radius:9px;width:0;transition:width .8s var(--ease)}
.cat-row .sum{text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.cat-row .sum small{display:block;font-size:12px;color:var(--muted);font-weight:600}

.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--t);color:var(--c);flex:none}

/* ---------- list ---------- */
.list{padding:6px}
.day-head{display:flex;justify-content:space-between;padding:12px 10px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.day-head:first-child{padding-top:6px}
.item{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px;border-radius:var(--r-sm);text-align:left;transition:background .2s,transform .2s var(--spring)}
.item:active{transform:scale(.98);background:var(--soft)}
.item .t{font-weight:700;font-size:18px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{font-size:13px;color:var(--muted);font-weight:500;display:block}
.item .m{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.flash{animation:flash 1.4s var(--ease)}
.more{display:block;margin:6px auto 4px;padding:10px 18px;border-radius:99px;font-weight:700;color:var(--ink-2);background:var(--soft)}
.empty{text-align:center;padding:34px 20px 30px;color:var(--muted)}
.empty .ill{width:64px;height:64px;border-radius:22px;background:var(--soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.swap-l>*{animation:inL .38s var(--ease) both}
.swap-r>*{animation:inR .38s var(--ease) both}
.swap-f>*{animation:rise .4s var(--ease) both}
.stagger>*{animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}

/* ---------- FAB ---------- */
.fab{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);height:62px;padding:0 30px 0 24px;border-radius:999px;background:var(--ink);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(31,30,28,.28),0 2px 6px rgba(31,30,28,.2);z-index:20;transition:transform .25s var(--spring),box-shadow .25s;animation:fabIn .6s .2s var(--spring) both;white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.94)}
.fab svg{transition:transform .4s var(--spring)}
.fab:hover svg{transform:rotate(90deg)}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(31,30,28,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:28px 28px 0 0;z-index:40;padding:0 16px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);visibility:hidden}
.sheet.open{transform:translateY(0);visibility:visible}
.sheet.dragging{transition:none}
.grab{display:flex;justify-content:center;padding:10px 0 4px;cursor:grab;touch-action:none;position:sticky;top:0;background:var(--card);z-index:2}
.grab span{width:42px;height:5px;border-radius:9px;background:var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px}
.sheet-head h2{font-family:var(--display);font-weight:600;font-size:24px}
.sheet-head .icon-btn{box-shadow:none;background:var(--soft);width:40px;height:40px}

.amount{display:flex;justify-content:center;align-items:baseline;gap:6px;font-weight:800;font-size:clamp(44px,13vw,56px);letter-spacing:-.03em;padding:0 0 6px;font-variant-numeric:tabular-nums;min-height:66px}
.amount .cur{font-size:.55em;color:var(--muted);font-weight:600;letter-spacing:0}
.amount.zero #amountVal{color:#C9C3B8}
.amount.bump #amountVal{animation:bump .18s var(--ease)}
.amount.shake{animation:shake .4s}

.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px 4px;margin-bottom:10px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border-radius:14px;transition:transform .2s var(--spring)}
.cat:active{transform:scale(.9)}
.cat .ico{width:50px;height:50px;border-radius:16px;transition:background .25s,color .25s,transform .35s var(--spring),box-shadow .25s}
.cat small{font-size:12px;font-weight:600;color:var(--muted);line-height:1.15;text-align:center;transition:color .2s}
.cat[aria-pressed=true] .ico{background:var(--c);color:#fff;transform:scale(1.06);box-shadow:0 6px 16px var(--sh)}
.cat[aria-pressed=true] small{color:var(--ink);font-weight:800}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative;height:40px;padding:0 16px;border-radius:99px;background:var(--soft);font-weight:700;font-size:15px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,transform .2s var(--spring);cursor:pointer}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.note{width:100%;height:48px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:#fff;padding:0 14px;font-size:16px;margin:10px 0;transition:border-color .2s}
.note:focus{outline:none;border-color:var(--ink)}
.note::placeholder{color:#B4AEA3}
.name-field{display:block;margin:10px 0 8px;border:2px solid var(--line);border-radius:18px;padding:9px 16px 10px;background:#fff;transition:border-color .2s,box-shadow .2s;cursor:text}
.name-field:focus-within{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(31,30,28,.06)}
.name-field span{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.name-field input{width:100%;border:0;outline:0;background:none;font-size:22px;font-weight:700;padding:2px 0;letter-spacing:-.01em}
.name-field input::placeholder{color:#C4BEB3;font-weight:600}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:4px 0 4px}
.keypad button{height:52px;border-radius:16px;background:var(--soft);font-size:24px;font-weight:700;display:grid;place-items:center;transition:transform .15s var(--spring),background .15s}
.keypad button:active{transform:scale(.92);background:var(--line)}

.actions{display:flex;gap:10px;position:sticky;bottom:calc(-16px - var(--safe-b));background:var(--card);padding:8px 0 calc(16px + var(--safe-b));margin-bottom:calc(-16px - var(--safe-b));z-index:2}
.btn{height:58px;border-radius:18px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform .2s var(--spring),opacity .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{flex:1;background:var(--ink);color:#fff}
.btn.primary:disabled{opacity:.3}
.btn.danger{background:#FCEDEC;color:var(--danger)}
.btn.ghost{background:var(--soft);color:var(--ink);height:50px;font-size:15px;flex:1}
.btn.text-danger{color:var(--danger);height:48px;font-size:15px;width:100%;margin-top:8px}

.field{display:block;margin:16px 0}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 2px 8px}
.field .note{margin:0}
.btn-row{display:flex;gap:8px}
.hint{font-size:14px;color:var(--muted);background:var(--soft);border-radius:var(--r-sm);padding:12px 14px;margin-top:8px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px) scale(.96);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:16px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:15px;z-index:50;max-width:calc(100% - 32px);transition:all .35s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{color:#9BE3BD;font-weight:800;padding:6px 10px;border-radius:10px;white-space:nowrap}
.toast:not(.has-action){padding-right:18px}
#toastText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes fabIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes flash{0%{background:#E9F7EF}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (min-width:600px){.app{padding-top:40px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="date" id="dateLine"></p>
      <h1 class="greet"><span class="word" id="greetWord">Добрый день</span>,<br><em id="greetName">Саима</em></h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки"></button>
  </header>

  <nav class="seg" id="seg" role="tablist" aria-label="Период">
    <span class="pill" id="segPill"></span>
    <button role="tab" data-p="day" aria-selected="true">День</button>
    <button role="tab" data-p="week" aria-selected="false">Неделя</button>
    <button role="tab" data-p="month" aria-selected="false">Месяц</button>
    <button role="tab" data-p="year" aria-selected="false">Год</button>
  </nav>

  <section class="card summary" id="summary">
    <div class="pnav">
      <button class="arrow" id="prevBtn" aria-label="Назад"></button>
      <button class="plabel" id="periodLabel"><b id="plText">Сегодня</b><small>Вернуться к сегодня</small></button>
      <button class="arrow" id="nextBtn" aria-label="Вперёд"></button>
    </div>
    <div id="sumBody">
      <div class="total" id="total" aria-live="polite"></div>
      <div class="sub" id="sub"></div>
      <div class="chart" id="chart"></div>
      <div class="stack" id="stack"></div>
    </div>
  </section>

  <div id="catsWrap">
    <div class="section-title"><span>По категориям</span></div>
    <section class="card cats" id="cats"></section>
  </div>

  <div class="section-title" id="listTitle"><span>Расходы</span></div>
  <section class="card list" id="list"></section>
</div>

<button class="fab" id="addBtn"><span id="fabIcon"></span>Добавить расход</button>

<div class="backdrop" id="backdrop"></div>

<!-- Add / edit sheet -->
<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <div class="grab"><span></span></div>
  <div class="sheet-head"><h2 id="addTitle">Новый расход</h2><button class="icon-btn" data-close aria-label="Закрыть"></button></div>
  <div class="amount zero" id="amount"><span id="amountVal">0</span><span class="cur" id="amountCur">₽</span></div>
  <div class="catgrid" id="catGrid"></div>
  <div class="chips" id="dateChips">
    <button class="chip" data-d="0" aria-pressed="true">Сегодня</button>
    <button class="chip" data-d="-1" aria-pressed="false">Вчера</button>
    <label class="chip" id="pickChip" aria-pressed="false"><span id="pickIcon"></span><span id="pickText">Другой день</span><input type="date" id="dateInput" aria-label="Выбрать дату"></label>
  </div>
  <label class="name-field"><span>Название расхода</span><input id="note" placeholder="Например: хлеб и молоко" maxlength="60" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"></label>
  <div class="keypad" id="keypad"></div>
  <div class="actions">
    <button class="btn danger" id="delBtn" hidden></button>
    <button class="btn primary" id="saveBtn">Добавить</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="grab"><span></span></div>
  <div class="sheet-head"><h2 id="setTitle">Настройки</h2><button class="icon-btn" data-close aria-label="Закрыть"></button></div>
  <label class="field"><span>Как к вам обращаться</span><input class="note" id="nameInput" maxlength="24" autocomplete="off"></label>
  <div class="field"><span>Валюта</span><div class="chips" id="curChips"></div></div>
  <div class="field"><span>Резервная копия</span>
    <div class="btn-row"><button class="btn ghost" id="exportBtn">Сохранить копию</button><button class="btn ghost" id="importBtn">Загрузить копию</button></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <div class="field" id="installField" hidden><span>Приложение</span><button class="btn ghost" id="installBtn" style="width:100%">Установить на телефон</button></div>
  <p class="hint" id="iosHint" hidden>Чтобы добавить на экран iPhone: в Safari нажмите «Поделиться» → «На экран „Домой“». Потом открывайте расходы только с этого значка.</p>
  <button class="btn text-danger" id="wipeBtn">Удалить все расходы</button>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastBtn" hidden>Отменить</button></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS_KEY = 'saima-expenses-v1';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const svg = (n, s = 22, w = 2) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- categories ---------- */
const CATS = [
  { id:'food',   name:'Продукты',  color:'#16A34A', icon:'cart' },
  { id:'cafe',   name:'Кафе',      color:'#EA580C', icon:'coffee' },
  { id:'trans',  name:'Транспорт', color:'#4F46E5', icon:'bus' },
  { id:'home',   name:'Дом, ЖКХ',  color:'#0D9488', icon:'home' },
  { id:'health', name:'Здоровье',  color:'#DC2626', icon:'pill' },
  { id:'clothes',name:'Одежда',    color:'#9333EA', icon:'shirt' },
  { id:'phone',  name:'Связь',     color:'#0284C7', icon:'phone' },
  { id:'gifts',  name:'Подарки',   color:'#DB2777', icon:'gift' },
  { id:'beauty', name:'Красота',   color:'#CA8A04', icon:'sparkles' },
  { id:'other',  name:'Другое',    color:'#64748B', icon:'dots' }
];
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); const m = c => Math.round(255 - (255 - c) * a); return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`; };
CATS.forEach(c => { c.tint = tint(c.color, .13); c.shadow = c.color + '55'; });
const catById = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
const icoStyle = c => `--c:${c.color};--t:${c.tint};--sh:${c.shadow}`;

/* ---------- storage ---------- */
function load() {
  try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if (d && Array.isArray(d.expenses)) return d; } catch (e) {}
  return null;
}
let db = Object.assign({ expenses: [], name: 'Саима', currency: '₽', lastCat: 'food' }, load() || {});
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch (e) { toast('Не получилось сохранить — память переполнена'); }
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- formatting ---------- */
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const money = v => nf.format(Math.round(v * 100) / 100) + ' ' + db.currency;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const plural = (n, f) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]; };
const RASHOD = ['расход', 'расхода', 'расходов'];
const sumOf = arr => Math.round(arr.reduce((s, e) => s + e.amount, 0) * 100) / 100;

/* ---------- dates ---------- */
const DAY = 864e5;
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayDiff = d => Math.round((sod(d) - sod(new Date())) / DAY);
const fmtDM = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const MS = ['Я', 'Ф', 'М', 'А', 'М', 'И', 'И', 'А', 'С', 'О', 'Н', 'Д'];

function range(p, a) {
  const d = sod(a);
  if (p === 'day') return [d, addDays(d, 1)];
  if (p === 'week') { const s = addDays(d, -((d.getDay() + 6) % 7)); return [s, addDays(s, 7)]; }
  if (p === 'month') return [new Date(d.getFullYear(), d.getMonth(), 1), new Date(d.getFullYear(), d.getMonth() + 1, 1)];
  return [new Date(d.getFullYear(), 0, 1), new Date(d.getFullYear() + 1, 0, 1)];
}
function shiftAnchor(p, a, dir) {
  const d = sod(a);
  if (p === 'day') return addDays(d, dir);
  if (p === 'week') return addDays(d, 7 * dir);
  if (p === 'month') return new Date(d.getFullYear(), d.getMonth() + dir, 1);
  return new Date(d.getFullYear() + dir, 0, 1);
}
const isCurrent = (p, a) => { const [f, t] = range(p, a), n = Date.now(); return n >= f && n < t; };

function dayName(d) {
  const diff = dayDiff(d);
  if (diff === 0) return 'Сегодня';
  if (diff === -1) return 'Вчера';
  const o = { weekday: 'short', day: 'numeric', month: 'long' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return cap(d.toLocaleDateString('ru-RU', o));
}
function periodLabel(p, a) {
  const now = new Date();
  if (p === 'day') return dayName(a);
  if (p === 'week') {
    const [s, e0] = range(p, a), e = addDays(e0, -1);
    const cur = range(p, now)[0];
    if (+s === +cur) return 'Эта неделя';
    if (+s === +addDays(cur, -7)) return 'Прошлая неделя';
    return s.getMonth() === e.getMonth() ? `${s.getDate()}–${fmtDM(e)}` : `${fmtDM(s)} – ${fmtDM(e)}`;
  }
  if (p === 'month') {
    const m = cap(a.toLocaleDateString('ru-RU', { month: 'long' }));
    return a.getFullYear() === now.getFullYear() ? m : `${m} ${a.getFullYear()}`;
  }
  return String(a.getFullYear());
}
const BACK_TEXT = { day: 'Вернуться к сегодня', week: 'К этой неделе', month: 'К этому месяцу', year: 'К этому году' };

/* ---------- greeting ---------- */
function greet() {
  const now = new Date(), h = now.getHours();
  let word, icon;
  if (h >= 5 && h < 12) { word = 'Доброе утро'; icon = 'sunrise'; }
  else if (h >= 12 && h < 17) { word = 'Добрый день'; icon = 'sun'; }
  else if (h >= 17 && h < 23) { word = 'Добрый вечер'; icon = 'sunset'; }
  else { word = 'Доброй ночи'; icon = 'moon'; }
  const gw = $('#greetWord');
  if (gw.textContent !== word) gw.textContent = word;
  const gn = $('#greetName'), name = (db.name || '').trim() || 'Саима';
  if (gn.textContent !== name) gn.textContent = name;
  const dl = cap(now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }));
  $('#dateLine').innerHTML = svg(icon, 16, 2.2) + `<span>${dl}</span>`;
  document.title = `${word}, ${name}`;
}

/* ---------- state ---------- */
const state = { period: 'day', anchor: sod(new Date()), follow: true, filter: null, limit: 60 };

/* ---------- number animation ---------- */
let shownTotal = 0, rafId = 0;
function animateTotal(to) {
  cancelAnimationFrame(rafId);
  const el = $('#total'), from = shownTotal, t0 = performance.now(), dur = reduceMotion || from === to ? 0 : 650;
  const paint = v => { el.innerHTML = `<span>${nf.format(v)}</span><span class="cur">${esc(db.currency)}</span>`; };
  const step = now => {
    const p = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - p, 3);
    shownTotal = p === 1 ? to : from + (to - from) * e;
    paint(p === 1 ? to : Math.round(shownTotal));
    if (p < 1) rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function replay(el, cls) { el.classList.remove('swap-l', 'swap-r', 'swap-f', 'stagger'); void el.offsetWidth; el.classList.add(cls); }

/* ---------- render ---------- */
function render(anim) {
  const { period: p, anchor: a } = state;
  const [from, to] = range(p, a);
  const f = +from, t = +to;
  const items = db.expenses.filter(e => e.ts >= f && e.ts < t).sort((x, y) => y.ts - x.ts);
  if (state.filter && !items.some(e => e.cat === state.filter)) state.filter = null;
  const total = sumOf(items), cur = isCurrent(p, a);

  // segmented
  $$('#seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === p));
  moveSegPill();

  // nav
  $('#plText').textContent = periodLabel(p, a);
  $('#periodLabel small').textContent = BACK_TEXT[p];
  $('#periodLabel').classList.toggle('past', !cur);
  $('#nextBtn').disabled = cur || f > Date.now();

  animateTotal(total);

  // sub line
  let sub;
  if (!items.length) sub = cur && p === 'day' ? 'Сегодня пока без расходов' : 'Расходов нет';
  else if (p === 'day') sub = `${items.length} ${plural(items.length, RASHOD)}`;
  else {
    const days = Math.max(1, Math.round(((cur ? +sod(new Date()) + DAY : t) - f) / DAY));
    sub = `${items.length} ${plural(items.length, RASHOD)} · в среднем ${money(Math.round(total / days))} в день`;
  }
  $('#sub').textContent = sub;

  renderChart(p, from, to, items);
  renderCats(items, total);
  renderList(items, p);

  if (anim) {
    const cls = anim === 'l' ? 'swap-l' : anim === 'r' ? 'swap-r' : 'swap-f';
    replay($('#sumBody'), cls); replay($('#cats'), cls); replay($('#list'), cls);
  }
}

function renderChart(p, from, to, items) {
  const el = $('#chart');
  el.classList.remove('show');
  if (p === 'day') { el.innerHTML = ''; return; }
  const buckets = [];
  const now = Date.now();
  if (p === 'year') {
    for (let m = 0; m < 12; m++) {
      const s = new Date(from.getFullYear(), m, 1), e = new Date(from.getFullYear(), m + 1, 1);
      buckets.push({ s, e, label: MS[m], go: 'month' });
    }
  } else {
    for (let d = new Date(from), i = 0; d < to; d = addDays(d, 1), i++) {
      const n = d.getDate();
      const label = p === 'week' ? WD[i] : (n === 1 || n % 5 === 0) ? String(n) : '';
      buckets.push({ s: d, e: addDays(d, 1), label, go: 'day' });
    }
  }
  buckets.forEach(b => { b.v = sumOf(items.filter(x => x.ts >= +b.s && x.ts < +b.e)); });
  const max = Math.max(...buckets.map(b => b.v), 0);
  el.style.gap = p === 'month' ? '2px' : '6px';
  el.innerHTML = buckets.map((b, i) => {
    const future = +b.s > now, isNow = now >= +b.s && now < +b.e;
    const h = max ? Math.max(3, (b.v / max) * 100) : 3;
    const cls = ['col', future && 'future', isNow && 'now', !b.v && 'zero'].filter(Boolean).join(' ');
    const title = b.go === 'month' ? cap(b.s.toLocaleDateString('ru-RU', { month: 'long' })) : dayName(b.s);
    return `<button class="${cls}" data-i="${i}" aria-label="${esc(title)}: ${esc(money(b.v))}" title="${esc(title)}: ${esc(money(b.v))}"><i class="bar" style="height:${h}%;transition-delay:${reduceMotion ? 0 : i * 12}ms"></i><span>${b.label}</span></button>`;
  }).join('');
  el._buckets = buckets;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
}

function renderCats(items, total) {
  const wrap = $('#catsWrap'), el = $('#cats'), stack = $('#stack');
  if (!items.length) { wrap.hidden = true; stack.innerHTML = ''; return; }
  wrap.hidden = false;
  const by = {};
  items.forEach(e => { by[e.cat] = (by[e.cat] || 0) + e.amount; });
  const rows = Object.entries(by).map(([id, v]) => ({ c: catById(id), v })).sort((a, b) => b.v - a.v);
  stack.innerHTML = rows.map(r => `<i style="background:${r.c.color}" data-w="${(r.v / total) * 100}"></i>`).join('');
  el.innerHTML = rows.map((r, i) => {
    const pct = total ? Math.round((r.v / total) * 100) : 0;
    const cls = state.filter ? (state.filter === r.c.id ? 'on' : 'dim') : '';
    return `<button class="cat-row ${cls}" data-cat="${r.c.id}" style="--i:${i}" aria-pressed="${state.filter === r.c.id}">
      <span class="ico" style="${icoStyle(r.c)}">${svg(r.c.icon)}</span>
      <span><span class="name">${r.c.name}</span><span class="track"><i style="background:${r.c.color}" data-w="${(r.v / rows[0].v) * 100}"></i></span></span>
      <span class="sum">${money(r.v)}<small>${pct < 1 ? '<1' : pct}%</small></span></button>`;
  }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$('#stack i, #cats .track i').forEach(i => { i.style.width = i.dataset.w + '%'; });
  }));
}

function renderList(items, p) {
  const el = $('#list'), title = $('#listTitle');
  const shown = state.filter ? items.filter(e => e.cat === state.filter) : items;
  title.innerHTML = state.filter
    ? `<span>Расходы</span><button id="clearFilter">${esc(catById(state.filter).name)} ${svg('x', 14, 2.5)}</button>`
    : `<span>Расходы</span>`;
  if (!shown.length) {
    const cur = isCurrent(state.period, state.anchor);
    el.innerHTML = `<div class="empty"><div class="ill">${svg('wallet', 28, 1.8)}</div><b>${cur ? 'Здесь появятся ваши расходы' : 'В этот период расходов нет'}</b>${cur ? 'Нажмите «Добавить расход» внизу' : 'Выберите другой день или период'}</div>`;
    return;
  }
  const limited = shown.slice(0, state.limit);
  let html = '', lastKey = '', i = 0;
  const grouped = p !== 'day';
  const daySums = {};
  if (grouped) shown.forEach(e => { const k = ymd(new Date(e.ts)); daySums[k] = (daySums[k] || 0) + e.amount; });
  for (const e of limited) {
    const d = new Date(e.ts), k = ymd(d);
    if (grouped && k !== lastKey) { html += `<div class="day-head" style="--i:${i++}"><span>${dayName(d)}</span><span>${money(daySums[k])}</span></div>`; lastKey = k; }
    const c = catById(e.cat);
    const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const t = e.note ? esc(e.note) : c.name;
    const ds = e.note ? `${c.name} · ${time}` : time;
    html += `<button class="item" data-id="${e.id}" style="--i:${Math.min(i++, 14)}">
      <span class="ico" style="${icoStyle(c)}">${svg(c.icon)}</span>
      <span style="min-width:0"><span class="t">${t}</span><span class="d">${ds}</span></span>
      <span class="m">${money(e.amount)}</span></button>`;
  }
  if (shown.length > limited.length) html += `<button class="more" id="moreBtn">Показать ещё</button>`;
  el.innerHTML = html;
}

function moveSegPill() {
  const b = $(`#seg button[data-p="${state.period}"]`), pill = $('#segPill');
  if (!b) return;
  pill.style.width = b.offsetWidth + 'px';
  pill.style.transform = `translateX(${b.offsetLeft}px)`;
}

/* ---------- navigation ---------- */
function setPeriod(p) {
  if (p === state.period) return;
  state.period = p;
  if (state.follow) state.anchor = sod(new Date());
  state.follow = isCurrent(p, state.anchor);
  state.limit = 60;
  render('f');
}
function go(dir) {
  const next = shiftAnchor(state.period, state.anchor, dir);
  if (dir > 0 && +range(state.period, next)[0] > Date.now()) return;
  state.anchor = next;
  state.follow = isCurrent(state.period, next);
  state.limit = 60;
  render(dir < 0 ? 'l' : 'r');
}
function goNow() {
  if (state.follow) return;
  state.anchor = sod(new Date()); state.follow = true; state.limit = 60;
  render('r');
}

$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPeriod(b.dataset.p); });
$('#prevBtn').addEventListener('click', () => go(-1));
$('#nextBtn').addEventListener('click', () => go(1));
$('#periodLabel').addEventListener('click', goNow);
$('#chart').addEventListener('click', e => {
  const b = e.target.closest('.col'); if (!b) return;
  const bk = $('#chart')._buckets[+b.dataset.i];
  state.period = bk.go; state.anchor = sod(bk.s); state.follow = isCurrent(bk.go, bk.s); state.limit = 60;
  render('f');
});
$('#cats').addEventListener('click', e => {
  const b = e.target.closest('.cat-row'); if (!b) return;
  state.filter = state.filter === b.dataset.cat ? null : b.dataset.cat;
  render();
  if (state.filter) replay($('#list'), 'stagger');
});
$('#listTitle').addEventListener('click', e => { if (e.target.closest('#clearFilter')) { state.filter = null; render(); replay($('#list'), 'stagger'); } });
$('#list').addEventListener('click', e => {
  if (e.target.closest('#moreBtn')) { state.limit += 100; render(); return; }
  const b = e.target.closest('.item'); if (b) openEditor(b.dataset.id);
});
// swipe on summary card to change period
(() => {
  let x0 = null, y0 = 0;
  const s = $('#summary');
  s.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  s.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx > 0 ? -1 : 1);
  }, { passive: true });
})();
addEventListener('resize', moveSegPill);

/* ---------- sheets ---------- */
let openSheetEl = null;
function openSheet(el) {
  if (openSheetEl) closeSheet(true);
  openSheetEl = el;
  $('#backdrop').classList.add('show');
  el.style.transform = '';
  el.classList.add('open');
  el.scrollTop = 0;
  document.body.classList.add('lock');
  history.pushState({ sheet: el.id }, '');
}
function closeSheet(fromPop) {
  if (!openSheetEl) return;
  if (!fromPop && history.state && history.state.sheet) { history.back(); return; }
  const el = openSheetEl; openSheetEl = null;
  el.classList.remove('open'); el.style.transform = '';
  $('#backdrop').classList.remove('show');
  document.body.classList.remove('lock');
  if (document.activeElement && el.contains(document.activeElement)) document.activeElement.blur();
}
addEventListener('popstate', () => { if (openSheetEl) closeSheet(true); });
$('#backdrop').addEventListener('click', () => closeSheet());
$$('[data-close]').forEach(b => { b.innerHTML = svg('x', 20, 2.4); b.addEventListener('click', () => closeSheet()); });
// drag down to close
$$('.sheet').forEach(sh => {
  const g = sh.querySelector('.grab');
  let y0 = null, dy = 0;
  g.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; sh.classList.add('dragging'); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; sh.classList.remove('dragging'); if (dy > 90) closeSheet(); else sh.style.transform = ''; };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
});

/* ---------- add / edit ---------- */
const ed = { id: null, str: '', cat: 'food', date: sod(new Date()), keepTime: null };
const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', 'del'];
$('#keypad').innerHTML = KEYS.map(k => `<button data-k="${k}" aria-label="${k === 'del' ? 'Стереть' : k}">${k === 'del' ? svg('backspace', 26, 2) : k}</button>`).join('');
$('#catGrid').innerHTML = CATS.map(c => `<button class="cat" data-cat="${c.id}" style="${icoStyle(c)}" aria-pressed="false"><span class="ico">${svg(c.icon, 24)}</span><small>${c.name}</small></button>`).join('');
$('#pickIcon').innerHTML = svg('calendar', 17, 2.2);
$('#delBtn').innerHTML = svg('trash', 20, 2.2);
$('#delBtn').setAttribute('aria-label', 'Удалить');

function fmtStr(s) {
  if (!s) return '0';
  const [i, f] = s.split(',');
  const ii = (i || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return f !== undefined ? ii + ',' + f : ii;
}
const edAmount = () => Math.round((parseFloat((ed.str || '0').replace(',', '.')) || 0) * 100) / 100;
function paintEditor(bump) {
  const a = $('#amount');
  $('#amountVal').textContent = fmtStr(ed.str);
  $('#amountCur').textContent = db.currency;
  a.classList.toggle('zero', !edAmount());
  if (bump && !reduceMotion) { a.classList.remove('bump'); void a.offsetWidth; a.classList.add('bump'); }
  $$('#catGrid .cat').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === ed.cat));
  const diff = dayDiff(ed.date);
  $$('#dateChips .chip[data-d]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.d === diff)));
  const other = diff !== 0 && diff !== -1;
  $('#pickChip').setAttribute('aria-pressed', String(other));
  $('#pickText').textContent = other ? dayName(ed.date) : 'Другой день';
  const di = $('#dateInput'); di.max = ymd(new Date()); di.value = ymd(ed.date);
}
function press(k) {
  let s = ed.str;
  if (k === 'del') s = s.slice(0, -1);
  else if (k === ',') { if (!s.includes(',')) s = (s || '0') + ','; }
  else {
    const [i, f] = s.split(',');
    if (f !== undefined) { if (f.length < 2) s += k; }
    else if (s === '0') s = k;
    else if ((i || '').length < 9) s += k;
  }
  if (s === '0' && k === '0' && !ed.str) s = '';
  ed.str = s === '0' ? '' : s;
  paintEditor(true);
}
$('#keypad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
$('#catGrid').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) { ed.cat = b.dataset.cat; paintEditor(); } });
$('#dateChips').addEventListener('click', e => { const b = e.target.closest('.chip[data-d]'); if (b) { ed.date = addDays(sod(new Date()), +b.dataset.d); paintEditor(); } });
$('#dateInput').addEventListener('change', e => {
  const v = e.target.value; if (!v) return;
  const [y, m, d] = v.split('-').map(Number), nd = new Date(y, m - 1, d);
  ed.date = nd > new Date() ? sod(new Date()) : nd; paintEditor();
});
$('#pickChip').addEventListener('click', e => {
  const di = $('#dateInput');
  if (e.target === di) return;
  try { di.showPicker(); } catch (_) { di.focus(); di.click(); }
});
$('#note').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });

function openAdder() {
  Object.assign(ed, { id: null, str: '', cat: db.lastCat || 'food', date: sod(new Date()), keepTime: null });
  $('#note').value = '';
  $('#addTitle').textContent = 'Новый расход';
  $('#saveBtn').textContent = 'Добавить';
  $('#delBtn').hidden = true;
  paintEditor();
  openSheet($('#addSheet'));
}
function openEditor(id) {
  const e = db.expenses.find(x => x.id === id); if (!e) return;
  const d = new Date(e.ts);
  Object.assign(ed, { id, str: String(e.amount).replace('.', ','), cat: e.cat, date: sod(d), keepTime: d });
  $('#note').value = e.note || '';
  $('#addTitle').textContent = 'Изменить расход';
  $('#saveBtn').textContent = 'Сохранить';
  $('#delBtn').hidden = false;
  paintEditor();
  openSheet($('#addSheet'));
}
function tsFor(date, keep) {
  const t = keep || new Date(), d = new Date(date);
  d.setHours(t.getHours(), t.getMinutes(), t.getSeconds(), 0);
  return +d;
}
function saveExpense() {
  const amount = edAmount();
  if (!amount) {
    const a = $('#amount'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
    toast('Сначала введите сумму');
    return;
  }
  const note = $('#note').value.trim().slice(0, 60);
  const sameDay = ed.keepTime && ymd(ed.keepTime) === ymd(ed.date);
  const ts = tsFor(ed.date, sameDay ? ed.keepTime : (ed.keepTime || null));
  let rec;
  if (ed.id) {
    rec = db.expenses.find(x => x.id === ed.id);
    const before = { ...rec };
    Object.assign(rec, { amount, cat: ed.cat, note, ts });
    save(); closeSheet();
    focusOn(rec);
    toast('Изменения сохранены', () => { Object.assign(rec, before); save(); render(); });
  } else {
    rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), amount, cat: ed.cat, note, ts };
    db.expenses.push(rec); db.lastCat = ed.cat;
    save(); closeSheet();
    focusOn(rec);
    toast(`Добавлено: ${money(amount)}`, () => { db.expenses = db.expenses.filter(x => x.id !== rec.id); save(); render(); });
  }
}
function focusOn(rec) {
  const [f, t] = range(state.period, state.anchor);
  let anim;
  if (rec.ts < +f || rec.ts >= +t) { state.anchor = sod(new Date(rec.ts)); state.follow = isCurrent(state.period, state.anchor); anim = 'f'; }
  if (state.filter && state.filter !== rec.cat) state.filter = null;
  render(anim);
  const el = document.querySelector(`.item[data-id="${rec.id}"]`);
  if (el) { el.classList.add('flash'); }
}
function deleteExpense() {
  const idx = db.expenses.findIndex(x => x.id === ed.id); if (idx < 0) return;
  const [rec] = db.expenses.splice(idx, 1);
  save(); closeSheet(); render();
  toast('Расход удалён', () => { db.expenses.push(rec); save(); focusOn(rec); });
}
$('#addBtn').addEventListener('click', openAdder);
$('#saveBtn').addEventListener('click', saveExpense);
$('#delBtn').addEventListener('click', deleteExpense);
$('#fabIcon').innerHTML = svg('plus', 24, 2.6);
$('#prevBtn').innerHTML = svg('left', 24, 2.4);
$('#nextBtn').innerHTML = svg('right', 24, 2.4);
$('#settingsBtn').innerHTML = svg('settings', 22, 2.2);

// physical keyboard
addEventListener('keydown', e => {
  if (openSheetEl === $('#addSheet') && document.activeElement !== $('#note')) {
    if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === ',' || e.key === '.') { press(','); e.preventDefault(); }
    else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
    else if (e.key === 'Enter') { saveExpense(); e.preventDefault(); }
  }
  if (e.key === 'Escape' && openSheetEl) closeSheet();
});

/* ---------- toast ---------- */
let toastTimer = 0, toastUndo = null;
function toast(text, undo) {
  const t = $('#toast');
  $('#toastText').textContent = text;
  toastUndo = undo || null;
  $('#toastBtn').hidden = !undo;
  t.classList.toggle('has-action', !!undo);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastUndo = null; }, undo ? 5000 : 2200);
}
$('#toastBtn').addEventListener('click', () => {
  const u = toastUndo; toastUndo = null; $('#toast').classList.remove('show');
  if (u) { u(); toast('Отменено'); }
});

/* ---------- settings ---------- */
const CURRENCIES = ['₽', '₸', 'сум', 'сом', '₴', '$', '€'];
function paintSettings() {
  $('#nameInput').value = db.name;
  $('#curChips').innerHTML = CURRENCIES.map(c => `<button class="chip" data-c="${c}" aria-pressed="${db.currency === c}">${c}</button>`).join('');
}
$('#settingsBtn').addEventListener('click', () => { paintSettings(); openSheet($('#setSheet')); });
$('#nameInput').addEventListener('input', e => { db.name = e.target.value.trim() || 'Саима'; save(); greet(); });
$('#curChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  db.currency = b.dataset.c; save(); paintSettings(); shownTotal = -1; render();
});
$('#exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `rashody-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Копия сохранена в загрузки');
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.expenses;
    if (!Array.isArray(list)) throw 0;
    const have = new Set(db.expenses.map(x => x.id));
    const fresh = list.filter(x => x && x.id && typeof x.amount === 'number' && typeof x.ts === 'number' && !have.has(x.id))
      .map(x => ({ id: String(x.id), amount: x.amount, cat: catById(x.cat).id, note: String(x.note || '').slice(0, 60), ts: x.ts }));
    db.expenses.push(...fresh); save(); render('f');
    toast(fresh.length ? `Загружено: ${fresh.length} ${plural(fresh.length, RASHOD)}` : 'Новых расходов в копии нет');
  } catch (_) { toast('Не получилось прочитать файл'); }
});
$('#wipeBtn').addEventListener('click', () => {
  if (!db.expenses.length) { toast('Расходов пока нет'); return; }
  if (!confirm('Удалить все расходы? Это нельзя будет вернуть.')) return;
  db.expenses = []; save(); closeSheet(); render('f'); toast('Все расходы удалены');
});

/* ---------- install ---------- */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#installField').hidden = false; });
$('#installBtn').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; $('#installField').hidden = true;
});
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !standalone) $('#iosHint').hidden = false;

/* ---------- clock: greeting + day rollover ---------- */
let todayKey = ymd(new Date());
function tick() {
  greet();
  const k = ymd(new Date());
  if (k !== todayKey) {
    todayKey = k;
    if (state.follow) state.anchor = sod(new Date());
    render('f');
  }
}
setInterval(tick, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
addEventListener('focus', tick);
addEventListener('storage', e => { if (e.key === LS_KEY) { db = Object.assign(db, load() || {}); render(); } });

/* ---------- no zoom (iOS ignores user-scalable=no) ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault(); });

/* ---------- start ---------- */
greet();
render();
replay($('#cats'), 'stagger'); replay($('#list'), 'stagger');
if (document.fonts) document.fonts.ready.then(moveSegPill);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
